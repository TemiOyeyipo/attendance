<style>
  .attendance-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 600px;
    margin: 0 auto;
  }

  /* Expanded Camera Viewport */
  #qr-reader {
    width: 100%;
    min-height: 380px;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border-color);
  }

  #qr-reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }

  .verification-card {
    display: none;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
  }

  .student-photo {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin: 12px auto;
    border: 3px solid var(--accent);
  }

  .actions-group {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }

  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
  }

  .btn-approve { background: #10B981; }
  .btn-reject { background: #EF4444; }
  .btn-reset { background: var(--bg-hover); margin-top: 12px; width: 100%; }
</style>

<div class="attendance-container">
  <div id="qr-reader"></div>

  <!-- Student Verification Overlay -->
  <div id="verification-card" class="verification-card">
    <h3 style="color: var(--text-muted); font-size: 14px;">STUDENT VERIFICATION</h3>
    <img id="student-img" class="student-photo" src="" alt="Student Profile">
    <h2 id="student-name" style="margin-top: 8px;">---</h2>
    <p id="student-id-display" style="color: var(--text-muted); margin-top: 4px;">ID: ---</p>
    <p id="student-programme" style="color: var(--accent); font-size: 14px; margin-top: 2px;">---</p>

    <div class="actions-group">
      <button class="btn btn-reject" onclick="rejectStudent()">Reject</button>
      <button class="btn btn-approve" onclick="approveAttendance()">Approve & Mark</button>
    </div>
  </div>
</div>

<!-- Include Html5Qrcode Library -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
  let activeStudentData = null;
  let audioContext = null;

  // Single Beep Generator
  function playBeep() {
    try {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();
      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.type = "sine";
      osc.frequency.value = 800;
      gain.gain.setValueAtTime(0.1, audioContext.currentTime);
      osc.start();
      osc.stop(audioContext.currentTime + 0.15);
    } catch(e) { console.warn("Audio unavailable", e); }
  }

  function renderAttendanceView() {
    const readerElem = document.getElementById('qr-reader');
    if (!readerElem) return;

    if (window.html5QrcodeScanner) {
      try { window.html5QrcodeScanner.clear(); } catch(e){}
    }

    window.html5QrcodeScanner = new Html5QrcodeScanner(
      "qr-reader", 
      { 
        fps: 10, 
        qrbox: { width: 280, height: 280 },
        aspectRatio: 1.0
      }, 
      /* verbose= */ false
    );

    window.html5QrcodeScanner.render(onScanSuccess, onScanFailure);
  }

  function onScanSuccess(decodedText) {
    playBeep();

    // 1. Pause scanner to stop endless loop & continuous beeping
    if (window.html5QrcodeScanner) {
      window.html5QrcodeScanner.pause(true);
    }

    // 2. Fetch student details from Google Sheets backend or local state
    fetchStudentDetails(decodedText);
  }

  function onScanFailure(error) {
    // Ignore frame read failures
  }

  function fetchStudentDetails(scannedID) {
    // Call Google Apps Script server function
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(displayVerificationCard)
        .withFailureHandler(handleFetchError)
        .getStudentByID(scannedID);
    } else {
      // Demo Fallback for local testing
      displayVerificationCard({
        studentID: scannedID,
        fullName: "Sample Student",
        programme: "Computer Science",
        photoUrl: "https://via.placeholder.com/150"
      });
    }
  }

  function displayVerificationCard(student) {
    if (!student) {
      alert("Student ID not found in database!");
      resumeScanner();
      return;
    }

    activeStudentData = student;
    document.getElementById('student-img').src = student.photoUrl || 'https://via.placeholder.com/150';
    document.getElementById('student-name').innerText = student.fullName || student.name;
    document.getElementById('student-id-display').innerText = "ID: " + (student.studentID || student.id);
    document.getElementById('student-programme').innerText = student.programme || "";

    document.getElementById('verification-card').style.display = 'block';
  }

  function handleFetchError(err) {
    alert("Error retrieving student profile: " + err.message);
    resumeScanner();
  }

  function approveAttendance() {
    if (!activeStudentData) return;

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(() => {
          alert("Attendance logged for " + activeStudentData.fullName);
          resumeScanner();
        })
        .markStudentAttendance(activeStudentData.studentID);
    } else {
      alert("Attendance marked successfully (Demo)!");
      resumeScanner();
    }
  }

  function rejectStudent() {
    resumeScanner();
  }

  function resumeScanner() {
    activeStudentData = null;
    document.getElementById('verification-card').style.display = 'none';
    if (window.html5QrcodeScanner) {
      window.html5QrcodeScanner.resume();
    }
  }
</script>
