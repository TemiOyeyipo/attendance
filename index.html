<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Attendance Scan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --ink:#10152B; --panel:#1A2148; --panel-2:#232B58;
    --brass:#D9A441; --brass-soft:rgba(217,164,65,0.16);
    --success:#3FAE6B; --alert:#E2604F;
    --paper:#F4F1E8; --paper-dim:#B9BEDB;
    --line:rgba(244,241,232,0.10);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:#000;}
  body{
    font-family:'Inter',sans-serif; color:var(--paper);
    display:flex; justify-content:center; align-items:stretch;
    -webkit-tap-highlight-color:transparent;
  }
  .app-shell{
    width:100%; max-width:430px; min-height:100vh; min-height:100dvh;
    background:var(--ink); display:flex; flex-direction:column;
    position:relative; overflow:hidden;
  }

  /* Top bar */
  .topbar{
    padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 14px;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border-bottom:1px solid var(--line); z-index:5;
  }
  .session-info h1{ font-size:15px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  .session-info p{ font-size:12px; color:var(--paper-dim); margin:2px 0 0; }
  .counter-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--panel-2); border:1px solid var(--line);
    border-radius:20px; padding:6px 12px 6px 10px;
  }
  .counter-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--success); }
  .counter-pill span{ font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; }

  /* Scan stage */
  .scan-stage{ position:relative; flex:1; background:#000; overflow:hidden; }
  #reader{ width:100%; height:100%; }
  #reader video{ width:100%!important; height:100%!important; object-fit:cover; }
  #reader img{ display:none; } /* hide library's default UI bits */

  .reticle{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:2;
  }
  .reticle svg{ width:64%; max-width:260px; aspect-ratio:1; }
  .reticle-hint{
    position:absolute; bottom:28px; left:0; right:0; text-align:center;
    font-size:13px; color:var(--paper-dim); pointer-events:none; z-index:2;
  }

  .flash{
    position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0;
  }
  .flash.on{ animation:flashPulse 0.5s ease-out; }
  @keyframes flashPulse{
    0%{ opacity:0.55; } 100%{ opacity:0; }
  }

  .end-btn{
    position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px;
    z-index:4; background:rgba(16,21,43,0.7); border:1px solid var(--line);
    color:var(--paper); border-radius:20px; padding:7px 13px; font-size:12px;
    font-weight:500; display:none;
  }

  /* Bottom sheet */
  .sheet-backdrop{
    position:absolute; inset:0; background:rgba(8,10,22,0.55); z-index:9;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease;
  }
  .sheet-backdrop.show{ opacity:1; pointer-events:auto; }

  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:10;
    background:var(--panel); border-radius:24px 24px 0 0;
    padding:22px 22px calc(env(safe-area-inset-bottom,0px) + 22px);
    transform:translateY(100%);
    transition:transform 0.45s cubic-bezier(.2,.9,.25,1.05);
    box-shadow:0 -12px 40px rgba(0,0,0,0.4);
  }
  .sheet.show{ transform:translateY(0); }
  .sheet-grip{ width:36px; height:4px; background:var(--line); border-radius:2px; margin:0 auto 18px; }

  .student-row{ display:flex; align-items:center; gap:14px; }
  .student-photo{
    width:64px; height:64px; border-radius:50%; object-fit:cover;
    border:2px solid var(--line); background:var(--panel-2); flex-shrink:0;
  }
  .student-photo.pending{ filter:grayscale(1); opacity:0.5; }
  .student-name{ font-family:'Fraunces',serif; font-size:21px; font-weight:600; margin:0; line-height:1.15; }
  .student-meta{ font-size:12.5px; color:var(--paper-dim); margin:3px 0 0; }

  .checklist{ margin:18px 0 4px; display:flex; flex-direction:column; gap:9px; }
  .check-row{ display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--paper-dim); }
  .check-row .icon{
    width:18px; height:18px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--line); font-size:11px;
  }
  .check-row.pass{ color:var(--paper); }
  .check-row.pass .icon{ background:var(--success); border-color:var(--success); color:#08210f; }
  .check-row.fail{ color:var(--alert); }
  .check-row.fail .icon{ background:var(--alert); border-color:var(--alert); color:#2a0906; }

  .sheet-actions{ display:flex; gap:10px; margin-top:20px; }
  .btn{
    flex:1; border:none; border-radius:100px; padding:15px 0;
    font-size:14.5px; font-weight:600; font-family:'Inter',sans-serif;
    cursor:pointer; transition:transform 0.15s ease, box-shadow 0.2s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-ghost{ background:transparent; border:1.5px solid var(--line); color:var(--paper-dim); flex:0 0 auto; padding:15px 22px; }
  .btn-approve{
    background:var(--panel-2); color:var(--paper-dim);
    box-shadow:none; pointer-events:none;
  }
  .btn-approve.ready{
    background:var(--brass); color:#2A1D06; pointer-events:auto;
    animation:readyGlow 1.1s ease-out;
  }
  @keyframes readyGlow{
    0%{ box-shadow:0 0 0 0 rgba(217,164,65,0.6); }
    70%{ box-shadow:0 0 0 14px rgba(217,164,65,0); }
    100%{ box-shadow:0 0 0 0 rgba(217,164,65,0); }
  }

  .toast{
    position:absolute; top:calc(env(safe-area-inset-top,0px) + 66px); left:20px; right:20px;
    z-index:11; background:var(--panel-2); border:1px solid var(--line);
    border-radius:14px; padding:12px 16px; font-size:13px;
    transform:translateY(-16px); opacity:0; transition:all 0.3s ease; pointer-events:none;
  }
  .toast.show{ transform:translateY(0); opacity:1; }
</style>
</head>
<body>

<div class="app-shell">

  <div class="topbar">
    <div class="session-info">
      <h1 id="sessionCourse">Systematic Theology II</h1>
      <p id="sessionMeta">Diploma in Ministry · Lesson 5</p>
    </div>
    <div class="counter-pill">
      <span class="dot"></span>
      <span id="countToday">0</span>
    </div>
  </div>

  <div class="scan-stage" id="scanStage">
    <div id="reader"></div>

    <div class="reticle">
      <svg viewBox="0 0 100 100" fill="none">
        <path d="M4 24V10a6 6 0 0 1 6-6h14" stroke="#F4F1E8" stroke-width="4" stroke-linecap="round"/>
        <path d="M96 24V10a6 6 0 0 0-6-6H76" stroke="#F4F1E8" stroke-width="4" stroke-linecap="round"/>
        <path d="M4 76v14a6 6 0 0 0 6 6h14" stroke="#F4F1E8" stroke-width="4" stroke-linecap="round"/>
        <path d="M96 76v14a6 6 0 0 1-6 6H76" stroke="#F4F1E8" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="reticle-hint">Align the student's QR code in frame</div>
    <div class="flash" id="flash"></div>
    <button class="end-btn" id="endBtn">End session</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="sheet-backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="student-row">
      <img id="studentPhoto" class="student-photo pending" src="" alt="">
      <div>
        <p class="student-name" id="studentName">—</p>
        <p class="student-meta" id="studentMeta">—</p>
      </div>
    </div>

    <div class="checklist" id="checklist"></div>

    <div class="sheet-actions">
      <button class="btn btn-ghost" id="rejectBtn">Rescan</button>
      <button class="btn btn-approve" id="approveBtn" disabled>Mark present</button>
    </div>
  </div>

</div>

<script>
  // ---- Demo data (swap for your real Apps Script endpoint — see callServer) ----
  const SESSION = { programme: "Diploma in Ministry", course: "Systematic Theology II", lesson: "Lesson 5" };
  const MOCK_STUDENTS = [
    { qr:"STU-1001", id:"STU-1001", name:"Ifeoma Adeyemi",  programme:"Diploma in Ministry", photo:"https://i.pravatar.cc/200?img=47" },
    { qr:"STU-1002", id:"STU-1002", name:"Daniel Okonkwo",  programme:"Diploma in Ministry", photo:"https://i.pravatar.cc/200?img=12" },
    { qr:"STU-1003", id:"STU-1003", name:"Grace Umeh",      programme:"Certificate in Bible Studies", photo:"https://i.pravatar.cc/200?img=32" }
  ];
  let todayCount = 0;

  // Replace with your deployed Apps Script /exec URL to go live; falls back to
  // MOCK_STUDENTS automatically if the URL is still the placeholder or fetch fails.
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

  async function callServer(action, params) {
    if (APPS_SCRIPT_URL.includes("YOUR_DEPLOYMENT_ID")) throw new Error("not configured");
    const res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, params: params || {} })
    });
    return res.json();
  }

  document.getElementById("sessionCourse").textContent = SESSION.course;
  document.getElementById("sessionMeta").textContent = `${SESSION.programme} · ${SESSION.lesson}`;

  const sheet = document.getElementById("sheet");
  const backdrop = document.getElementById("backdrop");
  const flashEl = document.getElementById("flash");
  const toastEl = document.getElementById("toast");
  const approveBtn = document.getElementById("approveBtn");
  const rejectBtn = document.getElementById("rejectBtn");

  let html5QrCode, currentStudent = null, scannerBusy = false;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2200);
  }

  function flash(color) {
    flashEl.style.background = color;
    flashEl.classList.remove("on");
    void flashEl.offsetWidth;
    flashEl.classList.add("on");
  }

  function openSheet() { backdrop.classList.add("show"); sheet.classList.add("show"); }
  function closeSheet() {
    backdrop.classList.remove("show"); sheet.classList.remove("show");
    setTimeout(() => { if (html5QrCode) html5QrCode.resume(); }, 300);
  }

  function renderChecklist(rows) {
    const el = document.getElementById("checklist");
    el.innerHTML = "";
    rows.forEach(r => {
      const div = document.createElement("div");
      div.className = "check-row " + (r.pass === null ? "" : r.pass ? "pass" : "fail");
      div.innerHTML = `<span class="icon">${r.pass === null ? "…" : r.pass ? "✓" : "✕"}</span><span>${r.label}</span>`;
      el.appendChild(div);
    });
  }

  async function lookupStudent(qrValue) {
    try {
      const res = await callServer("getStudentByQrCode", { qrText: qrValue });
      return res && res.found ? res : null;
    } catch (e) {
      return MOCK_STUDENTS.find(s => s.qr === qrValue) || null;
    }
  }

  async function onScanSuccess(decodedText) {
    if (scannerBusy) return;
    scannerBusy = true;
    html5QrCode.pause();

    const photo = document.getElementById("studentPhoto");
    const nameEl = document.getElementById("studentName");
    const metaEl = document.getElementById("studentMeta");

    photo.src = ""; photo.classList.add("pending");
    nameEl.textContent = "Looking up…";
    metaEl.textContent = decodedText;
    renderChecklist([{ label: "Matching student ID", pass: null }]);
    approveBtn.classList.remove("ready"); approveBtn.disabled = true; approveBtn.textContent = "Mark present";
    openSheet();

    const student = await lookupStudent(decodedText);
    currentStudent = student;

    if (!student) {
      flash("rgba(226,96,79,0.5)");
      nameEl.textContent = "Not recognized";
      metaEl.textContent = decodedText;
      renderChecklist([{ label: "No matching student record", pass: false }]);
      return;
    }

    photo.src = student.photo || student.pictureURL || "";
    photo.classList.remove("pending");
    nameEl.textContent = student.name || student.fullName;
    metaEl.textContent = `${student.id || student.studentID} · ${student.programme}`;

    const enrolled = (student.programme === SESSION.programme);
    renderChecklist([
      { label: "Student record found", pass: true },
      { label: `Enrolled in ${SESSION.programme}`, pass: enrolled }
    ]);

    if (enrolled) {
      flash("rgba(217,164,65,0.35)");
      approveBtn.disabled = false;
      approveBtn.classList.add("ready");
    } else {
      flash("rgba(226,96,79,0.5)");
      approveBtn.disabled = true;
    }
  }

  function onScanFailure() {}

  async function startScanner() {
    html5QrCode = new Html5Qrcode("reader");
    try {
      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 240 },
        onScanSuccess,
        onScanFailure
      );
    } catch (err) {
      showToast("Camera unavailable: " + err);
    }
  }

  approveBtn.addEventListener("click", async () => {
    if (!currentStudent || approveBtn.disabled) return;
    approveBtn.disabled = true;
    approveBtn.textContent = "Saving…";

    const payload = {
      studentID: currentStudent.id || currentStudent.studentID,
      studentName: currentStudent.name || currentStudent.fullName,
      programme: SESSION.programme, course: SESSION.course, lesson: SESSION.lesson,
      entryType: "QR Scan"
    };

    let ok = true;
    try {
      const res = await callServer("saveApprovedAttendance", payload);
      ok = !!(res && res.success);
    } catch (e) { /* mock mode: assume success */ }

    if (ok) {
      todayCount++;
      document.getElementById("countToday").textContent = todayCount;
      approveBtn.textContent = "Marked present ✓";
      setTimeout(() => { scannerBusy = false; closeSheet(); }, 700);
    } else {
      approveBtn.textContent = "Retry";
      approveBtn.disabled = false;
    }
  });

  rejectBtn.addEventListener("click", () => { scannerBusy = false; closeSheet(); });
  backdrop.addEventListener("click", () => { scannerBusy = false; closeSheet(); });

  startScanner();
</script>
</body>
</html>
